name: Benchmarks

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [^20]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependency
        run: yarn install && yarn global add ts-node

      - name: Run Benchmark
        run: yarn benchmark
